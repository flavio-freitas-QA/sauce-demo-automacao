name: QA Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Instalar dependências e rodar Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
      - name: Gerar resumo no GitHub Actions
        if: always()
        run: npm run cy:summary
      - name: Upload de screenshots em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      - name: Upload de relatório HTML do Cypress (mochawesome)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports
          retention-days: 14

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Rodar Playwright (todos os projetos)
        # Execução única, cobrindo funcional, mobile e visual. Rodar a suíte
        # visual num segundo comando sobrescreveria o results.json e o resumo
        # publicado abaixo passaria a contar só aqueles testes.
        #
        # --ignore-snapshots: os baselines de imagem são gerados no Windows do
        # desenvolvedor e a renderização de fonte difere no Linux do runner.
        # As asserções de layout do dia 009 continuam valendo; só a comparação
        # de imagem é pulada. Ela roda localmente com `npm run pw:visual`.
        run: npm run pw:test:ci
      - name: Gerar resumo no GitHub Actions
        if: always()
        run: npm run pw:summary
      - name: Upload de relatório do Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api-tests:
    name: API Tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run api:test
